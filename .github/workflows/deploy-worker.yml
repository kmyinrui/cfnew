name: Deploy Worker

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Deploy
    steps:
      - uses: actions/checkout@v4

      - name: Deploy to Cloudflare Workers
        env:
          CF_API_TOKEN: *** secrets.CF_API_TOKEN }}
        run: |
          npm install -g wrangler
          wrangler deploy --compatibility-date 2026-01-20
